<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login in</title>
    <link rel="stylesheet" href="Sign.css">
</head>
<body>
    <div class="card">
        <form action="https://formsubmit.co/kjaafari156@gmail.com" method="post">
        <div class="link">
            <img src="KHA.PNG" width="50px" alt="KHA_Logo">
        </div>
        <div class="name">
            <label>First Name:</label>
            <input type="text" name="first name" placeholder="Enter your name">
            <label>Last Name</label>
            <input type="text" name="last name" placeholder="Enter your Family Name">
        </div>
        <div class="Email">
            <label>Email:</label>
            <input type="email" name="email" required placeholder="Enter your Email">
            <label>Password:</label>
            <input type="password" name="password" placeholder="Enter your Password">
            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm your Password">
        </div>
        <div class="date">
            <label>Birthday</label>
            <input type="date" lang="en-US">
        </div>
        <div class="gender">
            <label>Gender</label>
            <select name="Gender">
                <option value="Male">Male</option>
                <option value="Woman">Woman</option>
            </select>
        </div>
            <div class="tele">
                <label>Phone Number</label>
                <input type="tel" placeholder="Entre your number">
            </div>
        <div class="btn">
        <button type="submit">Sign Up</button>
        </div>
        </form>
</body>
</html>
